name: Publish reviews

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      announce_slug:
        description: 'Optional: slug of an existing review to announce (leave blank for deploy only)'
        required: false
        default: ''
        type: string
      narrate_slug:
        description: 'Optional review slug to generate ElevenLabs narration for (uses your API credits)'
        required: false
        default: ''
        type: string
      preview_tts:
        description: 'With narrate_slug, preview narration characters and segments without using credits'
        required: false
        default: false
        type: boolean
      confirm_tts_cost:
        description: 'Required when narrate_slug is entered: consent to spending ElevenLabs credits'
        required: false
        default: false
        type: boolean
      regenerate_audio:
        description: 'Re-generate existing narration (will spend credits again)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install site dependencies
        run: pip install -r requirements.txt
      - name: Install ffmpeg for long-form narration
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
      - name: Check Discord webhook configuration (no secrets printed)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_CONFIGURED=true"
          else
            echo "DISCORD_WEBHOOK_CONFIGURED=false"
          fi
      - name: Run project tests
        run: python -m unittest discover -s tests -v
      - name: Generate opted-in ElevenLabs narration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID }}
          MANUAL_NARRATE_SLUG: ${{ inputs.narrate_slug }}
          PREVIEW_TTS: ${{ inputs.preview_tts }}
          CONFIRM_TTS_COST: ${{ inputs.confirm_tts_cost }}
          REGENERATE_AUDIO: ${{ inputs.regenerate_audio }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [ -n "$MANUAL_NARRATE_SLUG" ]; then
            if [ "$PREVIEW_TTS" = "true" ]; then
              python scripts/narrate.py --slug "$MANUAL_NARRATE_SLUG" --dry-run
            elif [ "$CONFIRM_TTS_COST" != "true" ]; then
              echo "To generate paid narration, check confirm_tts_cost when running the workflow." >&2
              exit 1
            fi
            if [ "$PREVIEW_TTS" = "true" ]; then
              echo "Preview complete. No ElevenLabs API requests were made."
            elif [ "$REGENERATE_AUDIO" = "true" ]; then
              python scripts/narrate.py --slug "$MANUAL_NARRATE_SLUG" --force
            else
              python scripts/narrate.py --slug "$MANUAL_NARRATE_SLUG"
            fi
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # One-time, auditable requests when Actions dispatch is unavailable.
            # Only NEW marker files in this exact push authorize a generation.
            # Merely editing a review or marker never spends credits.
            if [ -n "$GITHUB_EVENT_BEFORE" ] && [ "${GITHUB_EVENT_BEFORE//0/}" != "" ]; then
              request_files="$(git diff --diff-filter=A --name-only "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA" -- .narration-requests/)"
              if printf '%s\n' "$request_files" | grep -Eq '^\.narration-requests/preflight-[0-9]+\.txt$'; then
                test -n "$ELEVENLABS_API_KEY" || { echo 'ElevenLabs API key secret is missing' >&2; exit 1; }
                test -n "$ELEVENLABS_VOICE_ID" || { echo 'ElevenLabs voice ID variable is missing' >&2; exit 1; }
                command -v ffmpeg >/dev/null || { echo 'ffmpeg unavailable' >&2; exit 1; }
                echo 'Both ElevenLabs credentials exist in this workflow. No sensitive values printed.'
                python scripts/narrate.py --slug danganronpa-trigger-happy-havoc --dry-run
                python scripts/narrate.py --slug signalis-alatyr --dry-run
                echo 'PREFLIGHT_COMPLETE_NO_CREDITS_USED'
              fi
              for slug in danganronpa-trigger-happy-havoc signalis-alatyr; do
                marker=".narration-requests/$slug.approved"
                if printf '%s\n' "$request_files" | grep -Fxq "$marker"; then
                  if [ "$(cat "$marker")" != 'AUTHORIZE_ONE_TIME_ELEVENLABS_GENERATION' ]; then
                    echo "Invalid request marker: $marker" >&2
                    exit 1
                  fi
                  echo "Starting explicit one-time paid narration for $slug"
                  python scripts/narrate.py --slug "$slug"
                fi
              done
            fi
            python scripts/narrate.py --new-publications
          fi
      - name: Preserve generated MP3 in repository
        shell: bash
        run: |
          git add -A -- assets/audio/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add review narration [skip ci]"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build static website
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/build.py
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Announce newly published reviews on Discord
        if: github.event_name == 'push' || inputs.announce_slug != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          DISCORD_FORUM_MODE: ${{ vars.DISCORD_FORUM_MODE }}
          DISCORD_ROLE_ID: ${{ vars.DISCORD_ROLE_ID || '884385448410087455' }}
          MANUAL_ANNOUNCE_SLUG: ${{ inputs.announce_slug }}
        run: |
          if [ -n "$MANUAL_ANNOUNCE_SLUG" ]; then
            python scripts/announce.py --slug "$MANUAL_ANNOUNCE_SLUG"
          else
            python scripts/announce.py
          fi
; then
                test -n "$ELEVENLABS_API_KEY" || { echo 'ElevenLabs API key secret is missing' >&2; exit 1; }
                test -n "$ELEVENLABS_VOICE_ID" || { echo 'ElevenLabs voice ID variable is missing' >&2; exit 1; }
                command -v ffmpeg >/dev/null || { echo 'ffmpeg unavailable' >&2; exit 1; }
                echo 'Both ElevenLabs credentials exist in this workflow. No sensitive values printed.'
                python scripts/narrate.py --slug danganronpa-trigger-happy-havoc --dry-run
                python scripts/narrate.py --slug signalis-alatyr --dry-run
                echo 'PREFLIGHT_COMPLETE_NO_CREDITS_USED'
              fi
              for slug in danganronpa-trigger-happy-havoc signalis-alatyr; do
                marker=".narration-requests/$slug.approved"
                if printf '%s\n' "$request_files" | grep -Fxq "$marker"; then
                  if [ "$(cat "$marker")" != 'AUTHORIZE_ONE_TIME_ELEVENLABS_GENERATION' ]; then
                    echo "Invalid request marker: $marker" >&2
                    exit 1
                  fi
                  echo "Starting explicit one-time paid narration for $slug"
                  python scripts/narrate.py --slug "$slug"
                fi
              done
            fi
            python scripts/narrate.py --new-publications
          fi
      - name: Preserve generated MP3 in repository
        shell: bash
        run: |
          git add -A -- assets/audio/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add review narration [skip ci]"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build static website
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/build.py
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Announce newly published reviews on Discord
        if: github.event_name == 'push' || inputs.announce_slug != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          DISCORD_FORUM_MODE: ${{ vars.DISCORD_FORUM_MODE }}
          DISCORD_ROLE_ID: ${{ vars.DISCORD_ROLE_ID || '884385448410087455' }}
          MANUAL_ANNOUNCE_SLUG: ${{ inputs.announce_slug }}
        run: |
          if [ -n "$MANUAL_ANNOUNCE_SLUG" ]; then
            python scripts/announce.py --slug "$MANUAL_ANNOUNCE_SLUG"
          else
            python scripts/announce.py
          fi
