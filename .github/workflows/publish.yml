name: Publish reviews

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      announce_slug:
        description: 'Optional: slug of an existing review to announce (leave blank for deploy only)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install site dependencies
        run: pip install -r requirements.txt
      - name: Install ffmpeg for narration
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Check Discord webhook configuration (no secrets printed)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_CONFIGURED=true"
          else
            echo "DISCORD_WEBHOOK_CONFIGURED=false"
          fi
      - name: Run project tests
        run: python -m unittest discover -s tests -v
      - name: Inspect British voice options without generating speech
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/voice_audition.py --inspect-on-new-marker
      - name: Generate explicitly requested British emotional voice auditions
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/voice_samples.py --only-new-request
      - name: Generate approved expressive Dandolla1 review narration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/full_expressive.py --only-new-request
      - name: Preserve generated MP3 in repository
        shell: bash
        run: |
          git add -A -- assets/audio/
          if [ -d assets/voice-auditions ]; then git add -A -- assets/voice-auditions/; fi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add review narration [skip ci]"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build static website
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/build.py
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Announce newly published reviews on Discord
        if: github.event_name == 'push' || inputs.announce_slug != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          DISCORD_FORUM_MODE: ${{ vars.DISCORD_FORUM_MODE }}
          DISCORD_ROLE_ID: ${{ vars.DISCORD_ROLE_ID || '884385448410087455' }}
          MANUAL_ANNOUNCE_SLUG: ${{ inputs.announce_slug }}
        run: |
          if [ -n "$MANUAL_ANNOUNCE_SLUG" ]; then
            python scripts/announce.py --slug "$MANUAL_ANNOUNCE_SLUG"
          else
            python scripts/announce.py
          fi
